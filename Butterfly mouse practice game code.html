<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Butterflies! 🦋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: float 20s infinite ease-in-out;
        }

        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 20%;
            left: -120px;
        }

        .cloud1:before {
            width: 50px;
            height: 40px;
            top: -20px;
            left: 20px;
        }

        .cloud1:after {
            width: 60px;
            height: 30px;
            top: -10px;
            right: 20px;
        }

        .cloud2 {
            width: 120px;
            height: 50px;
            top: 40%;
            left: -150px;
            animation-delay: 5s;
        }

        .cloud2:before {
            width: 60px;
            height: 50px;
            top: -25px;
            left: 25px;
        }

        .cloud2:after {
            width: 70px;
            height: 40px;
            top: -15px;
            right: 25px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateX(0) translateY(0);
            }
            50% {
                transform: translateX(110vw) translateY(-20px);
            }
        }

        .butterfly {
            position: absolute;
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.1s;
            animation: flutter 2s infinite ease-in-out;
        }

        .butterfly:hover {
            transform: scale(1.2);
        }

        @keyframes flutter {
            0%, 100% {
                transform: translateY(0px) rotate(-5deg);
            }
            25% {
                transform: translateY(-10px) rotate(5deg);
            }
            50% {
                transform: translateY(0px) rotate(-5deg);
            }
            75% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 0.6s ease-out forwards;
        }

        @keyframes sparkle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 24px;
            font-weight: bold;
            color: #FF6B9D;
            z-index: 100;
            text-align: center;
        }

        #stars {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }

        .star {
            font-size: 30px;
            opacity: 0.3;
            transition: all 0.3s;
        }

        .star.earned {
            opacity: 1;
            animation: starPop 0.5s ease-out;
        }

        @keyframes starPop {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }

        #celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 215, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        #celebration h1 {
            font-size: 72px;
            color: #FF1493;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        #celebration p {
            font-size: 36px;
            color: #4169E1;
            margin-bottom: 30px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 28px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-weight: bold;
            transition: all 0.3s;
            margin: 10px;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .button:active {
            transform: scale(0.95);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        #encouragement {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #FF6B9D;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #restartBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            z-index: 99;
        }

        .flower {
            position: absolute;
            bottom: 0;
            font-size: 40px;
            animation: sway 3s infinite ease-in-out;
        }

        @keyframes sway {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        
        <div id="scoreBoard">
            <div>Butterflies Caught: <span id="score">0</span> / <span id="total">10</span></div>
            <div id="stars">
                <span class="star">⭐</span>
                <span class="star">⭐</span>
                <span class="star">⭐</span>
                <span class="star">⭐</span>
                <span class="star">⭐</span>
            </div>
        </div>

        <div id="encouragement"></div>

        <button id="restartBtn" class="button">🔄 Play Again</button>
    </div>

    <div id="celebration">
        <h1>🎉 AMAZING JOB! 🎉</h1>
        <p>You caught all the butterflies!</p>
        <div style="font-size: 80px; margin: 20px;">🦋🌟🦋🌟🦋</div>
        <button class="button" onclick="restartGame()">🎮 Play Again!</button>
    </div>

    <script>
        let score = 0;
        const totalButterflies = 10;
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const celebration = document.getElementById('celebration');
        const encouragement = document.getElementById('encouragement');
        const restartBtn = document.getElementById('restartBtn');

        const butterflyColors = ['🦋', '🦋', '🦋'];
        const encouragements = ['Great!', 'Awesome!', 'Super!', 'Fantastic!', 'Amazing!', 'Wonderful!', 'Perfect!', 'Excellent!'];

        function createFlowers() {
            const flowerTypes = ['🌻', '🌺', '🌸', '🌼', '🌷'];
            for (let i = 0; i < 8; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.textContent = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                flower.style.left = `${Math.random() * 90}%`;
                flower.style.animationDelay = `${Math.random() * 2}s`;
                gameContainer.appendChild(flower);
            }
        }

        function createButterfly() {
            const butterfly = document.createElement('div');
            butterfly.className = 'butterfly';
            butterfly.textContent = butterflyColors[Math.floor(Math.random() * butterflyColors.length)];
            butterfly.style.fontSize = `${40 + Math.random() * 30}px`;
            
            const maxX = window.innerWidth - 80;
            const maxY = window.innerHeight - 200;
            butterfly.style.left = `${Math.random() * maxX}px`;
            butterfly.style.top = `${100 + Math.random() * maxY}px`;
            
            butterfly.addEventListener('click', function(e) {
                catchButterfly(e, butterfly);
            });
            
            gameContainer.appendChild(butterfly);
        }

        function catchButterfly(e, butterfly) {
            score++;
            scoreDisplay.textContent = score;
            
            // Create sparkle particles
            createParticles(e.clientX, e.clientY);
            
            // Play celebration sound (visual feedback)
            butterfly.style.animation = 'none';
            butterfly.style.transform = 'scale(2)';
            butterfly.style.opacity = '0';
            
            setTimeout(() => {
                butterfly.remove();
            }, 300);
            
            // Show encouragement
            showEncouragement(e.clientX, e.clientY);
            
            // Update stars
            updateStars();
            
            // Check if game is complete
            if (score >= totalButterflies) {
                setTimeout(showCelebration, 500);
            } else {
                // Create new butterfly
                setTimeout(createButterfly, 300);
            }
        }

        function createParticles(x, y) {
            const colors = ['#FF6B9D', '#FFD93D', '#6BCF7F', '#4ECDC4', '#FF6B9D'];
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (Math.PI * 2 * i) / 12;
                const distance = 50 + Math.random() * 50;
                particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                gameContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 600);
            }
        }

        function showEncouragement(x, y) {
            const message = encouragements[Math.floor(Math.random() * encouragements.length)];
            encouragement.textContent = message;
            encouragement.style.left = `${x}px`;
            encouragement.style.top = `${y - 50}px`;
            encouragement.style.opacity = '1';
            encouragement.style.transform = 'translate(-50%, -50%) scale(1.2)';
            
            setTimeout(() => {
                encouragement.style.opacity = '0';
                encouragement.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 800);
        }

        function updateStars() {
            const stars = document.querySelectorAll('.star');
            const starsToEarn = Math.floor((score / totalButterflies) * 5);
            stars.forEach((star, index) => {
                if (index < starsToEarn && !star.classList.contains('earned')) {
                    star.classList.add('earned');
                }
            });
        }

        function showCelebration() {
            celebration.style.display = 'flex';
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#FF6B9D', '#FFD93D', '#6BCF7F', '#4ECDC4', '#C44569', '#F8B500'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}vw`;
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = `${Math.random() * 2}s`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        function restartGame() {
            score = 0;
            scoreDisplay.textContent = '0';
            celebration.style.display = 'none';
            
            // Remove all butterflies
            document.querySelectorAll('.butterfly').forEach(b => b.remove());
            
            // Reset stars
            document.querySelectorAll('.star').forEach(star => {
                star.classList.remove('earned');
            });
            
            // Create initial butterflies
            for (let i = 0; i < 5; i++) {
                createButterfly();
            }
        }

        // Initialize game
        restartBtn.addEventListener('click', restartGame);
        createFlowers();
        for (let i = 0; i < 5; i++) {
            createButterfly();
        }
    </script>
</body>
</html>
